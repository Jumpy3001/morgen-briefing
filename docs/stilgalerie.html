  <div class=&quot;page&quot;>
    <div class=&quot;kicker&quot;>Morgen-Briefing</div>
    <h1>Was heute zählt</h1>
    <div class=&quot;meta-row&quot;>
      <span>Samstag, 15. August 2026</span>
      <span class=&quot;dot&quot;></span>
      <span>≈ 5 Min. Lesezeit</span>
      <span class=&quot;dot&quot;></span>
      <span>KI &amp; Tech · Wirtschaft · Politik · Wissenschaft</span>
    </div>
    <p class=&quot;lede&quot;>Ein Chatbot, der gestern noch Geld gekostet hat, ist heute für alle gratis. Eine Autoindustrie, die in zwölf Monaten 42.300 Stellen verloren hat. Eine Regierung, der vorgeworfen wird, ihre Bürger nicht vor Hitze zu schützen. Und Physiker, die aus gewöhnlichem Sonnenlicht etwas herausholen, das lange als unmöglich galt. Vier Meldungen, vier Welten — und dahinter dieselbe Rechnung, die gerade überall neu aufgemacht wird: Was an einer Stelle billiger wird, wird an einer anderen teurer. Man sieht es nur selten am selben Tag.</p>

    <div class=&quot;section&quot;>
      <h2><span class=&quot;n&quot;>01</span>KI &amp; Tech — Der Preis fällt, die Rechnung kommt später</h2>
      <p>OpenAI hat GPT-5.6 unter dem Namen „Luna&quot; zum neuen Standardmodell in ChatGPT gemacht — auch für Nutzer, die nichts zahlen, und ohne Limit bei der Zahl der Chats. Möglich wurde das durch eine Preissenkung von rund 80 Prozent, die das Unternehmen zuvor bei den Betriebskosten des Modells durchgesetzt hat. Das ist die eigentliche Nachricht: Nicht dass ein Modell schlauer geworden ist, sondern dass ein Modell dieser Klasse inzwischen billig genug ist, um es zu verschenken.</p>
      <p>Was das anrichtet, sieht man an den Zahlen der Konkurrenz. Google meldete am 11. August, dass Gemini die Marke von einer Milliarde monatlich aktiver Nutzer überschritten hat — eine Größenordnung, die sonst Betriebssystemen und sozialen Netzwerken vorbehalten war. Anthropic wiederum meldete erstmals einen Gewinn, was in einer Branche, die jahrelang vor allem Kapital verbrannt hat, fast wie eine Provokation wirkt. Drei Unternehmen, drei völlig unterschiedliche Wege, und alle drei sind gerade an dem Punkt angekommen, an dem KI kein Experiment mehr ist, sondern Infrastruktur.</p>
      <p>Die Kehrseite hat diese Woche das Weiße Haus auf den Plan gerufen. Nach Berichten, wonach KI-Werkzeuge von Anthropic und OpenAI in die Systeme fremder Unternehmen eingedrungen sind, wurden die großen Technologiekonzerne zu Gesprächen geladen. Anthropic kündigte parallel eine Prüf-API an, mit der Dritte künftig zuverlässiger erkennen sollen, ob ein Text von Claude stammt. Beides sind Reaktionen auf dasselbe Problem: Ein Werkzeug, das gratis und überall verfügbar ist, ist eben auch für die verfügbar, die damit nichts Gutes vorhaben.</p>
    </div>

    <div class=&quot;section&quot;>
      <h2><span class=&quot;n&quot;>02</span>Wirtschaft — 42.300 Stellen und ein Fluss, der zu wenig Wasser führt</h2>
      <p>Während die eine Branche ihre Produkte verschenken kann, verliert die andere so viele Arbeitsplätze wie nie: In der deutschen Automobilindustrie sind binnen eines Jahres 42.300 Stellen weggefallen. Das ist kein Ausrutscher in einer Quartalsbilanz, sondern der sichtbare Teil eines Umbaus — Elektrifizierung, chinesische Konkurrenz, teure Standorte —, der in den kommenden Jahren weitergehen wird. Ein Institut warnt zugleich vor „erheblichen Lücken&quot; auf dem Arbeitsmarkt: Es fehlen also nicht einfach Jobs, es fehlen an anderer Stelle gleichzeitig Menschen. Beides zusammen ist das eigentlich schwierige Problem.</p>
      <p>Dazu kommt ein Faktor, der mit Konjunkturpolitik wenig zu tun hat: das Wasser. Die Wirtschaftsweise Veronika Grimm rechnet mit steigenden Preisen als Folge der aktuellen Niedrigwasserstände und kritisiert, dass die Politik zu wenig Vorsorge gegen die Folgen des Klimawandels trifft. Der Zusammenhang ist unspektakulär und deshalb leicht zu übersehen: Führt der Rhein zu wenig Wasser, können Binnenschiffe nur teilbeladen fahren, Kohle, Öl und Chemikalien müssen auf Schiene und Straße ausweichen, und am Ende steht ein Aufschlag auf Produkten, die mit Flüssen auf den ersten Blick nichts zu tun haben.</p>
      <p>Das Gesamtbild bleibt widersprüchlich. Der Preisdruck lässt insgesamt nach, Prognosen sehen Deutschland 2026 zurück auf dem Wachstumspfad — gleichzeitig verliert der Arbeitsmarkt an Dynamik und die Signale aus den USA, China und Europa passen immer schlechter zusammen. Wer heute etwas Eindeutiges über die deutsche Konjunktur sagt, hat vermutlich nur eine Hälfte der Zahlen gelesen.</p>
    </div>

    <div class=&quot;section&quot;>
      <h2><span class=&quot;n&quot;>03</span>Politik — Hitze, Akten und die Frage, wer den Schlüssel bekommt</h2>
      <p>In Berlin wirft die Linke der Bundesregierung vor, die Bevölkerung nicht ausreichend vor extremer Hitze zu schützen, und will dabei vor allem Vermieter stärker in die Pflicht nehmen. Hinter dem parteipolitischen Vorwurf steckt eine Frage, die Deutschland gerade erst lernt zu stellen: Hitzeschutz ist bislang etwas, das jeder für sich selbst organisiert — Rollladen runter, Ventilator an. Sobald man ihn als Teil der Wohnungsqualität begreift, wird daraus Baurecht, Mietrecht und am Ende Geld. Genau da beginnt der Streit.</p>
      <p>Deutlich grundsätzlicher ist die zweite Debatte des Tages. Mit Blick auf einen möglichen AfD-Innenminister in Sachsen-Anhalt warnt Jörg Müller, der frühere Präsident des brandenburgischen Verfassungsschutzes, was ein solches Amt konkret bedeuten würde: Zugriff auf V-Leute, auf geheime Akten, auf die Polizei. Das ist der Punkt, an dem eine abstrakte Koalitionsfrage sehr praktisch wird — nicht mehr die Frage, wer redet, sondern die Frage, wer die Schlüssel zu welchen Räumen bekommt.</p>
      <p>Beide Debatten haben mehr gemeinsam, als es scheint. In beiden geht es darum, wie belastbar Institutionen sind, die für ruhigere Zeiten gebaut wurden — ein Mietrecht, das mit 40 Grad nicht gerechnet hat, und ein Sicherheitsapparat, dessen Kontrollmechanismen darauf beruhen, dass alle Beteiligten dieselben Spielregeln anerkennen.</p>
    </div>

    <div class=&quot;section&quot;>
      <h2><span class=&quot;n&quot;>04</span>Wissenschaft — Verschränktes Sonnenlicht und eine 3000 Jahre alte Warnung</h2>
      <p>Zum Schluss zwei Meldungen, die weiter auseinanderliegen könnten und trotzdem zusammengehören. Physikern ist es erstmals gelungen, verschränkte Photonen aus ganz normalem Sonnenlicht zu erzeugen — etwas, das lange als unmöglich galt, weil Sonnenlicht als hoffnungslos ungeordnet gilt. Verschränkung ist der Effekt, bei dem zwei Lichtteilchen so miteinander verbunden bleiben, dass die Messung am einen sofort etwas über das andere aussagt. Bisher brauchte man dafür Laser und viel Laborausrüstung. Wenn dieselbe Ressource auch aus dem Fenster kommt, wird Quantentechnik womöglich deutlich alltagstauglicher.</p>
      <p>Ähnlich bodenständig ist ein Ergebnis der TU Wien: Ein neues Material aus sogenannten MXenen und Gold erzeugt Ammoniak mithilfe von Sonnenlicht und Strom. Ammoniak ist der Grundstoff für einen Großteil des weltweiten Düngers — und seine Herstellung im klassischen Haber-Bosch-Verfahren verschlingt bis heute rund zwei Prozent der weltweiten Energie. Jeder Weg, der dieselbe Reaktion mit Licht statt mit Hochdruck und Erdgas schafft, ist deshalb kein Nischenthema, sondern greift direkt in die Energiebilanz der Landwirtschaft ein.</p>
      <p>Und dann noch eine Studie, die den Blick nach hinten richtet: Im östlichen Mittelmeer gab es in der Bronzezeit extreme Dürren, die zum Zusammenbruch gleich mehrerer Gesellschaften beigetragen haben könnten. Es ist die unbequemste Meldung des Tages, weil sie das Muster liefert, in das die anderen passen: Hoch entwickelte, gut vernetzte Systeme sind nicht deshalb stabil, weil sie komplex sind. Manchmal sind sie es genau deswegen nicht.</p>
    </div>
    <p class=&quot;closing&quot;>Der rote Faden des Tages ist eine Preisfrage. Rechenleistung wird billiger, Modelle werden verschenkt, Sonnenlicht soll bald Dünger machen — und gleichzeitig kostet ein zu niedriger Fluss Geld, kostet ein Umbau der Autoindustrie 42.300 Stellen, kostet Hitze Gesundheit und kostet institutionelles Vertrauen erstaunlich wenig Aufwand zu beschädigen. Fortschritt macht Dinge selten einfach billiger. Er verschiebt nur, wer bezahlt. Morgen wieder, um 7 Uhr.</p>

      <span class=&quot;dot&quot;></span>
      <span>Tims persönlicher Verlag</span>
    </div>
  </div>

      <h2><span class=&quot;n&quot;>02</span>Wirtschaft — 42.300 Stellen und ein Fluss, der zu wenig Wasser führt</h2>
      <p>Während die eine Branche ihre Produkte verschenken kann, verliert die andere so viele Arbeitsplätze wie nie: In der deutschen Automobilindustrie sind binnen eines Jahres 42.300 Stellen weggefallen. Das ist kein Ausrutscher in einer Quartalsbilanz, sondern der sichtbare Teil eines Umbaus — Elektrifizierung, chinesische Konkurrenz, teure Standorte —, der in den kommenden Jahren weitergehen wird. Ein Institut warnt zugleich vor „erheblichen Lücken&quot; auf dem Arbeitsmarkt: Es fehlen also nicht einfach Jobs, es fehlen an anderer Stelle gleichzeitig Menschen. Beides zusammen ist das eigentlich schwierige Problem.</p>
      <p>Dazu kommt ein Faktor, der mit Konjunkturpolitik wenig zu tun hat: das Wasser. Die Wirtschaftsweise Veronika Grimm rechnet mit steigenden Preisen als Folge der aktuellen Niedrigwasserstände und kritisiert, dass die Politik zu wenig Vorsorge gegen die Folgen des Klimawandels trifft. Der Zusammenhang ist unspektakulär und deshalb leicht zu übersehen: Führt der Rhein zu wenig Wasser, können Binnenschiffe nur teilbeladen fahren, Kohle, Öl und Chemikalien müssen auf Schiene und Straße ausweichen, und am Ende steht ein Aufschlag auf Produkten, die mit Flüssen auf den ersten Blick nichts zu tun haben.</p>
      <p>Das Gesamtbild bleibt widersprüchlich. Der Preisdruck lässt insgesamt nach, Prognosen sehen Deutschland 2026 zurück auf dem Wachstumspfad — gleichzeitig verliert der Arbeitsmarkt an Dynamik und die Signale aus den USA, China und Europa passen immer schlechter zusammen. Wer heute etwas Eindeutiges über die deutsche Konjunktur sagt, hat vermutlich nur eine Hälfte der Zahlen gelesen.</p>
    </div>

    <div class=&quot;section&quot;>
      <h2><span class=&quot;n&quot;>03</span>Politik — Hitze, Akten und die Frage, wer den Schlüssel bekommt</h2>
      <p>In Berlin wirft die Linke der Bundesregierung vor, die Bevölkerung nicht ausreichend vor extremer Hitze zu schützen, und will dabei vor allem Vermieter stärker in die Pflicht nehmen. Hinter dem parteipolitischen Vorwurf steckt eine Frage, die Deutschland gerade erst lernt zu stellen: Hitzeschutz ist bislang etwas, das jeder für sich selbst organisiert — Rollladen runter, Ventilator an. Sobald man ihn als Teil der Wohnungsqualität begreift, wird daraus Baurecht, Mietrecht und am Ende Geld. Genau da beginnt der Streit.</p>
      <p>Deutlich grundsätzlicher ist die zweite Debatte des Tages. Mit Blick auf einen möglichen AfD-Innenminister in Sachsen-Anhalt warnt Jörg Müller, der frühere Präsident des brandenburgischen Verfassungsschutzes, was ein solches Amt konkret bedeuten würde: Zugriff auf V-Leute, auf geheime Akten, auf die Polizei. Das ist der Punkt, an dem eine abstrakte Koalitionsfrage sehr praktisch wird — nicht mehr die Frage, wer redet, sondern die Frage, wer die Schlüssel zu welchen Räumen bekommt.</p>
      <p>Beide Debatten haben mehr gemeinsam, als es scheint. In beiden geht es darum, wie belastbar Institutionen sind, die für ruhigere Zeiten gebaut wurden — ein Mietrecht, das mit 40 Grad nicht gerechnet hat, und ein Sicherheitsapparat, dessen Kontrollmechanismen darauf beruhen, dass alle Beteiligten dieselben Spielregeln anerkennen.</p>
    </div>

    <div class=&quot;section&quot;>
      <h2><span class=&quot;n&quot;>04</span>Wissenschaft — Verschränktes Sonnenlicht und eine 3000 Jahre alte Warnung</h2>
      <p>Zum Schluss zwei Meldungen, die weiter auseinanderliegen könnten und trotzdem zusammengehören. Physikern ist es erstmals gelungen, verschränkte Photonen aus ganz normalem Sonnenlicht zu erzeugen — etwas, das lange als unmöglich galt, weil Sonnenlicht als hoffnungslos ungeordnet gilt. Verschränkung ist der Effekt, bei dem zwei Lichtteilchen so miteinander verbunden bleiben, dass die Messung am einen sofort etwas über das andere aussagt. Bisher brauchte man dafür Laser und viel Laborausrüstung. Wenn dieselbe Ressource auch aus dem Fenster kommt, wird Quantentechnik womöglich deutlich alltagstauglicher.</p>
      <p>Ähnlich bodenständig ist ein Ergebnis der TU Wien: Ein neues Material aus sogenannten MXenen und Gold erzeugt Ammoniak mithilfe von Sonnenlicht und Strom. Ammoniak ist der Grundstoff für einen Großteil des weltweiten Düngers — und seine Herstellung im klassischen Haber-Bosch-Verfahren verschlingt bis heute rund zwei Prozent der weltweiten Energie. Jeder Weg, der dieselbe Reaktion mit Licht statt mit Hochdruck und Erdgas schafft, ist deshalb kein Nischenthema, sondern greift direkt in die Energiebilanz der Landwirtschaft ein.</p>
      <p>Und dann noch eine Studie, die den Blick nach hinten richtet: Im östlichen Mittelmeer gab es in der Bronzezeit extreme Dürren, die zum Zusammenbruch gleich mehrerer Gesellschaften beigetragen haben könnten. Es ist die unbequemste Meldung des Tages, weil sie das Muster liefert, in das die anderen passen: Hoch entwickelte, gut vernetzte Systeme sind nicht deshalb stabil, weil sie komplex sind. Manchmal sind sie es genau deswegen nicht.</p>
    </div>
    <p class=&quot;closing&quot;>Der rote Faden des Tages ist eine Preisfrage. Rechenleistung wird billiger, Modelle werden verschenkt, Sonnenlicht soll bald Dünger machen — und gleichzeitig kostet ein zu niedriger Fluss Geld, kostet ein Umbau der Autoindustrie 42.300 Stellen, kostet Hitze Gesundheit und kostet institutionelles Vertrauen erstaunlich wenig Aufwand zu beschädigen. Fortschritt macht Dinge selten einfach billiger. Er verschiebt nur, wer bezahlt. Morgen wieder, um 7 Uhr.</p>
