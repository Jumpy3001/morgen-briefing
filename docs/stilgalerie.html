      <h1 class=&quot;titel&quot;>Moment<span class=&quot;kuerzel&quot;>/07</span></h1>
      <div class=&quot;datumszeile&quot;><span>Freitag, 2. Oktober 2026</span> <span class=&quot;trenner&quot;>✦</span> <span>KI &amp; Tech</span> <span class=&quot;trenner&quot;>✦</span> <span>Wirtschaft</span> <span class=&quot;trenner&quot;>✦</span> <span>Politik</span> <span class=&quot;trenner&quot;>✦</span> <span>Klima</span></div>
    </header>

    <p class=&quot;standfirst&quot;>Diese Woche bekommt fast jede gute Nachricht sofort eine zweite, unbequemere Zahl dazu. Deutschlands Wirtschaftsinstitute schrauben ihre Wachstumsprognose kräftig nach oben – mitgetragen von einem globalen KI-Boom, dessen größte Anbieter sich gleichzeitig vor den eigenen Aufsichtsbehörden verantworten müssen. In Berlin feiert eine Koalition einen Reformerfolg, den sie sich fast selbst zerstritten hätte. Und ein Sommer, der gerade erst zu Ende gegangen ist, hinterlässt eine Rechnung, die man erst jetzt vollständig aufgemacht bekommt: in Menschenleben, in leeren Frachtschiffen auf einem zu flachen Fluss. Vier Geschichten über denselben Mechanismus – der Erfolg ist selten der letzte Satz, meist kommt noch ein Nebensatz.</p>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>01</span>
        <span class=&quot;ressort-name&quot;>KI &amp; Tech</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Geld verdienen, Fragen beantworten</h2>
      <p>Zwei Zahlen zeigen, wie weit sich das Geschäft mit künstlicher Intelligenz von einem Experiment zu einem eigenen Wirtschaftszweig entwickelt hat: OpenAI hat seinen Umsatz – hochgerechnet auf ein volles Jahr, wie es bei schnell wachsenden Firmen üblich ist – seit Anfang des dritten Quartals um mehr als 70 Prozent gesteigert, auf einen Wert nahe 70 Milliarden US-Dollar. Den größten Anteil daran haben inzwischen Geschäftskunden, deren Umsätze sich in diesem Zeitraum mehr als verdoppelten; das Geschäft verschiebt sich also weg vom einzelnen Chat-Abo und hin zu Firmen, die KI in ihre eigenen Abläufe einbauen. Anthropic brachte parallel mit Claude Sonnet 5.5 ein Modell heraus, das zum gleichen Preis wie sein Vorgänger läuft, dabei aber nach Unternehmensangaben rund 30 Prozent schneller und günstiger pro Aufgabe ist – Fortschritt zeigt sich in dieser Branche inzwischen öfter an der Rechnung als an neuen Tricks.</p>
      <p>Parallel dazu wächst der Druck aus Washington. US-Medien berichteten Ende September übereinstimmend, die amerikanische Verbraucherschutzbehörde FTC habe eine breit angelegte Untersuchung zu Sicherheitsrisiken von OpenAI- und Anthropic-Systemen eingeleitet. Berichten zufolge prüfen beide Unternehmen gemeinsam mit externen Sicherheitsforschern zehntausende mutmaßliche Sicherheitsvorfälle, von denen ein Teil bisher nicht öffentlich bekannt war. Schon im August hatte OpenAI angekündigt, das Tempo der eigenen Modellentwicklung zu drosseln, um mehr Zeit für Sicherheitsprüfungen zu gewinnen – ein Zugeständnis, das zu einer Branche passt, die gerade erst lernt, wie viel Verantwortung mit ihrem eigenen Wachstum mitwächst.</p>
      <p>Beides gehört zusammen, auch wenn es in getrennten Pressemitteilungen steht: Je mehr ein Werkzeug verdient, desto genauer will jemand wissen, wie es das tut – und was es tut, wenn niemand hinschaut.</p>
    </div>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>02</span>
        <span class=&quot;ressort-name&quot;>Wirtschaft</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Besser als gedacht, mit Webfehlern</h2>
      <p>Einmal im Frühjahr und einmal im Herbst legen die führenden deutschen Wirtschaftsforschungsinstitute eine gemeinsame Prognose vor, die sogenannte Gemeinschaftsdiagnose – eine Art amtlicher Kassensturz für die Konjunktur. Die Herbstausgabe, Ende September vorgestellt, justiert kräftig nach oben: Für 2026 erwarten die Institute nun ein reales Wachstum von 1,3 Prozent, deutlich mehr als im Frühjahr veranschlagt, für 2027 rechnen sie mit 1,1 Prozent. Tragende Kraft sind überraschend starke Exporte und eine Industrie, die im ersten Halbjahr mehr Wert geschaffen hat als erwartet – nicht zuletzt, weil der weltweite KI-Boom Investitionen und Nachfrage nach deutschen Maschinen und Anlagen befeuert. Die Erholung, so betonen die Institute zugleich, bleibt insgesamt schwach und von Strukturproblemen belastet.</p>
      <p>Zwei dieser Strukturprobleme ziehen sich seit Monaten durch: hohe Energiepreise, die Betriebe und Haushalte weiter belasten, und ein Exportgeschäft, das in Kernbranchen wie Maschinenbau und Automobilindustrie zunehend Marktanteile an chinesische Konkurrenz verliert. Die bessere Prognose ist also keine Entwarnung, sondern eher eine Verschiebung der Dringlichkeit: Das Polster ist größer geworden, das Problem darunter nicht kleiner – und genau über die Frage, wer dieses Polster wofür ausgeben darf, streitet sich in Berlin gerade die Regierung.</p>
    </div>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>03</span>
        <span class=&quot;ressort-name&quot;>Politik</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Eine Reform, die fast an sich selbst scheiterte</h2>
      <p>In Berlin hat die schwarz-rote Koalition unter Friedrich Merz eine Woche hinter sich, die Beobachter unabhängig voneinander als „Chaos-Woche&quot; bezeichnet haben: Fast täglich brach ein neuer Streit auf, über Rente, Pflege und Steuern – drei Baustellen, die alle denselben Grund haben, nämlich die Frage, wie ein Staat mit alternder Bevölkerung seine Sozialsysteme bezahlt. Das Kanzleramt stoppte einen Vorschlag von Finanzminister Lars Klingbeil für eine Zuckersteuer, weil er von der gemeinsamen Verhandlungsgrundlage abgewichen sei und in dieser Form im Kabinett keine Mehrheit finde. Am lautesten wurde der Streit um die Pflegereform, mit der die Finanzierung der Pflegeversicherung für die kommenden Jahre neu geordnet werden soll: Die SPD wollte die Kabinettsentscheidung verschieben, Union-Verhandler sollten nach einem späten Eingreifen von Kanzler Merz am Dienstagabend aber nicht nachgeben.</p>
      <p>Am Ende stand ein Kompromiss, der der SPD in wichtigen Punkten entgegenkam, ihren ursprünglichen Wunsch nach einer Verschiebung aber nicht erfüllte – die Reform wurde am Mittwoch im Kabinett beschlossen. Dass es so weit kam, war offenbar kein Nebenschauplatz: Berichten zufolge schaltete sich sogar Bundespräsident Frank-Walter Steinmeier ein, dessen Amt für gewöhnlich eher repräsentiert als vermittelt, und telefonierte in der Sache mit Klingbeil und Innenminister Alexander Dobrindt, aus Sorge, die Koalition könnte an dem Streit zerbrechen. Die Reform ist beschlossen, kurz vor den nächsten Landtagswahlen, bei denen die Koalitionsparteien ohnehin unter Druck stehen. Der Preis dafür war ein Bild von einer Regierung, die sich selbst im Weg steht.</p>
    </div>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>04</span>
        <span class=&quot;ressort-name&quot;>Klima</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Die Rechnung für einen Sommer, der schon vorbei ist</h2>
      <p>Der Sommer 2026 ist nach vorläufigen Daten der zweitwärmste, der in Deutschland je gemessen wurde – und erst jetzt, mit einigem Abstand, zeigt sich vollständig, was er gekostet hat. Nach Schätzungen des Robert-Koch-Instituts starben rund 15.800 Menschen vorzeitig an den Folgen der Hitzewellen, mehr als in jedem der vergangenen zehn Jahre; rechnet man mit der breiteren Methode der Übersterblichkeit, die den tatsächlichen Sterbezahlen eines Jahres den langjährigen Durchschnitt gegenüberstellt, liegt die Zahl sogar bei rund 20.500. Allein die Hitzewelle Ende Juni erreichte laut einer sogenannten Attributionsstudie des Deutschen Wetterdienstes – einer Berechnung, die abschätzt, wie stark der Klimawandel ein konkretes Wetterereignis wahrscheinlicher gemacht hat – ein Ausmaß, das ohne den menschengemachten Klimawandel statistisch nahezu ausgeschlossen gewesen wäre.</p>
      <p>Dieselbe Trockenheit hat den Rhein auf historische Tiefstände gedrückt: Am Pegel Kaub fiel der Wasserstand auf 24 Zentimeter und unterbot damit den bisherigen Rekord von 2018. In Emmerich sank er auf minus vier Zentimeter, tiefer als je zuvor gemessen, und auch am Messpunkt Lobith, etwas weiter flussabwärts, wurde kein niedrigerer Stand je verzeichnet. Unterhalb von 40 Zentimetern bei Kaub ist nennenswerte Frachtschifffahrt praktisch nicht mehr möglich; Frachtschiffe fuhren zuletzt nur noch mit rund einem Fünftel ihrer eigentlichen Kapazität, was vier- bis fünfmal so viele Schiffe für dieselbe Ladung nötig machte – mit entsprechenden Folgekosten für Industrie und Handel entlang des Flusses. Mitte September fand zum fünften Mal die „Woche der Klimaanpassung&quot; statt – ein Name, der in diesem Jahr weniger nach Vorsorge klingt als nach Nachbereitung.</p>
    </div>
    <p class=&quot;schluss&quot;>Vier Geschichten, ein wiederkehrendes Muster: Fortschritt, Wachstum und politische Kompromisse kommen fast nie allein – sie bringen eine zweite Zahl mit, die erst später vorgelegt wird. Die KI-Branche verdient Rekordsummen und wird gleichzeitig genauer geprüft als je zuvor. Die deutsche Wirtschaft wächst stärker als gedacht, trägt aber dieselben alten Lasten weiter. Eine Koalition rettet ihre Reform, indem sie fast daran zerbricht. Und ein Sommer, der im Kalender schon vorbei ist, schreibt seine Rechnung erst jetzt, in Toten und in leeren Frachtschiffen. Morgen früh mehr davon.</p>
    <div class=&quot;signet&quot;>Ende der Ausgabe</div>
  </div>

    <p class=&quot;standfirst&quot;>Diese Woche bekommt fast jede gute Nachricht sofort eine zweite, unbequemere Zahl dazu. Deutschlands Wirtschaftsinstitute schrauben ihre Wachstumsprognose kräftig nach oben – mitgetragen von einem globalen KI-Boom, dessen größte Anbieter sich gleichzeitig vor den eigenen Aufsichtsbehörden verantworten müssen. In Berlin feiert eine Koalition einen Reformerfolg, den sie sich fast selbst zerstritten hätte. Und ein Sommer, der gerade erst zu Ende gegangen ist, hinterlässt eine Rechnung, die man erst jetzt vollständig aufgemacht bekommt: in Menschenleben, in leeren Frachtschiffen auf einem zu flachen Fluss. Vier Geschichten über denselben Mechanismus – der Erfolg ist selten der letzte Satz, meist kommt noch ein Nebensatz.</p>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>01</span>
        <span class=&quot;ressort-name&quot;>KI &amp; Tech</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Geld verdienen, Fragen beantworten</h2>
      <p>Zwei Zahlen zeigen, wie weit sich das Geschäft mit künstlicher Intelligenz von einem Experiment zu einem eigenen Wirtschaftszweig entwickelt hat: OpenAI hat seinen Umsatz – hochgerechnet auf ein volles Jahr, wie es bei schnell wachsenden Firmen üblich ist – seit Anfang des dritten Quartals um mehr als 70 Prozent gesteigert, auf einen Wert nahe 70 Milliarden US-Dollar. Den größten Anteil daran haben inzwischen Geschäftskunden, deren Umsätze sich in diesem Zeitraum mehr als verdoppelten; das Geschäft verschiebt sich also weg vom einzelnen Chat-Abo und hin zu Firmen, die KI in ihre eigenen Abläufe einbauen. Anthropic brachte parallel mit Claude Sonnet 5.5 ein Modell heraus, das zum gleichen Preis wie sein Vorgänger läuft, dabei aber nach Unternehmensangaben rund 30 Prozent schneller und günstiger pro Aufgabe ist – Fortschritt zeigt sich in dieser Branche inzwischen öfter an der Rechnung als an neuen Tricks.</p>
      <p>Parallel dazu wächst der Druck aus Washington. US-Medien berichteten Ende September übereinstimmend, die amerikanische Verbraucherschutzbehörde FTC habe eine breit angelegte Untersuchung zu Sicherheitsrisiken von OpenAI- und Anthropic-Systemen eingeleitet. Berichten zufolge prüfen beide Unternehmen gemeinsam mit externen Sicherheitsforschern zehntausende mutmaßliche Sicherheitsvorfälle, von denen ein Teil bisher nicht öffentlich bekannt war. Schon im August hatte OpenAI angekündigt, das Tempo der eigenen Modellentwicklung zu drosseln, um mehr Zeit für Sicherheitsprüfungen zu gewinnen – ein Zugeständnis, das zu einer Branche passt, die gerade erst lernt, wie viel Verantwortung mit ihrem eigenen Wachstum mitwächst.</p>
      <p>Beides gehört zusammen, auch wenn es in getrennten Pressemitteilungen steht: Je mehr ein Werkzeug verdient, desto genauer will jemand wissen, wie es das tut – und was es tut, wenn niemand hinschaut.</p>
    </div>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>02</span>
        <span class=&quot;ressort-name&quot;>Wirtschaft</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Besser als gedacht, mit Webfehlern</h2>
      <p>Einmal im Frühjahr und einmal im Herbst legen die führenden deutschen Wirtschaftsforschungsinstitute eine gemeinsame Prognose vor, die sogenannte Gemeinschaftsdiagnose – eine Art amtlicher Kassensturz für die Konjunktur. Die Herbstausgabe, Ende September vorgestellt, justiert kräftig nach oben: Für 2026 erwarten die Institute nun ein reales Wachstum von 1,3 Prozent, deutlich mehr als im Frühjahr veranschlagt, für 2027 rechnen sie mit 1,1 Prozent. Tragende Kraft sind überraschend starke Exporte und eine Industrie, die im ersten Halbjahr mehr Wert geschaffen hat als erwartet – nicht zuletzt, weil der weltweite KI-Boom Investitionen und Nachfrage nach deutschen Maschinen und Anlagen befeuert. Die Erholung, so betonen die Institute zugleich, bleibt insgesamt schwach und von Strukturproblemen belastet.</p>
      <p>Zwei dieser Strukturprobleme ziehen sich seit Monaten durch: hohe Energiepreise, die Betriebe und Haushalte weiter belasten, und ein Exportgeschäft, das in Kernbranchen wie Maschinenbau und Automobilindustrie zunehend Marktanteile an chinesische Konkurrenz verliert. Die bessere Prognose ist also keine Entwarnung, sondern eher eine Verschiebung der Dringlichkeit: Das Polster ist größer geworden, das Problem darunter nicht kleiner – und genau über die Frage, wer dieses Polster wofür ausgeben darf, streitet sich in Berlin gerade die Regierung.</p>
    </div>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>03</span>
        <span class=&quot;ressort-name&quot;>Politik</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Eine Reform, die fast an sich selbst scheiterte</h2>
      <p>In Berlin hat die schwarz-rote Koalition unter Friedrich Merz eine Woche hinter sich, die Beobachter unabhängig voneinander als „Chaos-Woche&quot; bezeichnet haben: Fast täglich brach ein neuer Streit auf, über Rente, Pflege und Steuern – drei Baustellen, die alle denselben Grund haben, nämlich die Frage, wie ein Staat mit alternder Bevölkerung seine Sozialsysteme bezahlt. Das Kanzleramt stoppte einen Vorschlag von Finanzminister Lars Klingbeil für eine Zuckersteuer, weil er von der gemeinsamen Verhandlungsgrundlage abgewichen sei und in dieser Form im Kabinett keine Mehrheit finde. Am lautesten wurde der Streit um die Pflegereform, mit der die Finanzierung der Pflegeversicherung für die kommenden Jahre neu geordnet werden soll: Die SPD wollte die Kabinettsentscheidung verschieben, Union-Verhandler sollten nach einem späten Eingreifen von Kanzler Merz am Dienstagabend aber nicht nachgeben.</p>
      <p>Am Ende stand ein Kompromiss, der der SPD in wichtigen Punkten entgegenkam, ihren ursprünglichen Wunsch nach einer Verschiebung aber nicht erfüllte – die Reform wurde am Mittwoch im Kabinett beschlossen. Dass es so weit kam, war offenbar kein Nebenschauplatz: Berichten zufolge schaltete sich sogar Bundespräsident Frank-Walter Steinmeier ein, dessen Amt für gewöhnlich eher repräsentiert als vermittelt, und telefonierte in der Sache mit Klingbeil und Innenminister Alexander Dobrindt, aus Sorge, die Koalition könnte an dem Streit zerbrechen. Die Reform ist beschlossen, kurz vor den nächsten Landtagswahlen, bei denen die Koalitionsparteien ohnehin unter Druck stehen. Der Preis dafür war ein Bild von einer Regierung, die sich selbst im Weg steht.</p>
    </div>

    <div class=&quot;ressort&quot;>
      <div class=&quot;ressort-zeile&quot;>
        <span class=&quot;ressort-nr&quot;>04</span>
        <span class=&quot;ressort-name&quot;>Klima</span>
        <span class=&quot;ressort-linie&quot;></span>
      </div>
      <h2>Die Rechnung für einen Sommer, der schon vorbei ist</h2>
      <p>Der Sommer 2026 ist nach vorläufigen Daten der zweitwärmste, der in Deutschland je gemessen wurde – und erst jetzt, mit einigem Abstand, zeigt sich vollständig, was er gekostet hat. Nach Schätzungen des Robert-Koch-Instituts starben rund 15.800 Menschen vorzeitig an den Folgen der Hitzewellen, mehr als in jedem der vergangenen zehn Jahre; rechnet man mit der breiteren Methode der Übersterblichkeit, die den tatsächlichen Sterbezahlen eines Jahres den langjährigen Durchschnitt gegenüberstellt, liegt die Zahl sogar bei rund 20.500. Allein die Hitzewelle Ende Juni erreichte laut einer sogenannten Attributionsstudie des Deutschen Wetterdienstes – einer Berechnung, die abschätzt, wie stark der Klimawandel ein konkretes Wetterereignis wahrscheinlicher gemacht hat – ein Ausmaß, das ohne den menschengemachten Klimawandel statistisch nahezu ausgeschlossen gewesen wäre.</p>
      <p>Dieselbe Trockenheit hat den Rhein auf historische Tiefstände gedrückt: Am Pegel Kaub fiel der Wasserstand auf 24 Zentimeter und unterbot damit den bisherigen Rekord von 2018. In Emmerich sank er auf minus vier Zentimeter, tiefer als je zuvor gemessen, und auch am Messpunkt Lobith, etwas weiter flussabwärts, wurde kein niedrigerer Stand je verzeichnet. Unterhalb von 40 Zentimetern bei Kaub ist nennenswerte Frachtschifffahrt praktisch nicht mehr möglich; Frachtschiffe fuhren zuletzt nur noch mit rund einem Fünftel ihrer eigentlichen Kapazität, was vier- bis fünfmal so viele Schiffe für dieselbe Ladung nötig machte – mit entsprechenden Folgekosten für Industrie und Handel entlang des Flusses. Mitte September fand zum fünften Mal die „Woche der Klimaanpassung&quot; statt – ein Name, der in diesem Jahr weniger nach Vorsorge klingt als nach Nachbereitung.</p>
    </div>
    <p class=&quot;schluss&quot;>Vier Geschichten, ein wiederkehrendes Muster: Fortschritt, Wachstum und politische Kompromisse kommen fast nie allein – sie bringen eine zweite Zahl mit, die erst später vorgelegt wird. Die KI-Branche verdient Rekordsummen und wird gleichzeitig genauer geprüft als je zuvor. Die deutsche Wirtschaft wächst stärker als gedacht, trägt aber dieselben alten Lasten weiter. Eine Koalition rettet ihre Reform, indem sie fast daran zerbricht. Und ein Sommer, der im Kalender schon vorbei ist, schreibt seine Rechnung erst jetzt, in Toten und in leeren Frachtschiffen. Morgen früh mehr davon.</p>
    <div class=&quot;signet&quot;>Ende der Ausgabe</div>
  </div>

      <h2>Die Rechnung für einen Sommer, der schon vorbei ist</h2>
      <p>Der Sommer 2026 ist nach vorläufigen Daten der zweitwärmste, der in Deutschland je gemessen wurde – und erst jetzt, mit einigem Abstand, zeigt sich vollständig, was er gekostet hat. Nach Schätzungen des Robert-Koch-Instituts starben rund 15.800 Menschen vorzeitig an den Folgen der Hitzewellen, mehr als in jedem der vergangenen zehn Jahre; rechnet man mit der breiteren Methode der Übersterblichkeit, die den tatsächlichen Sterbezahlen eines Jahres den langjährigen Durchschnitt gegenüberstellt, liegt die Zahl sogar bei rund 20.500. Allein die Hitzewelle Ende Juni erreichte laut einer sogenannten Attributionsstudie des Deutschen Wetterdienstes – einer Berechnung, die abschätzt, wie stark der Klimawandel ein konkretes Wetterereignis wahrscheinlicher gemacht hat – ein Ausmaß, das ohne den menschengemachten Klimawandel statistisch nahezu ausgeschlossen gewesen wäre.</p>
      <p>Dieselbe Trockenheit hat den Rhein auf historische Tiefstände gedrückt: Am Pegel Kaub fiel der Wasserstand auf 24 Zentimeter und unterbot damit den bisherigen Rekord von 2018. In Emmerich sank er auf minus vier Zentimeter, tiefer als je zuvor gemessen, und auch am Messpunkt Lobith, etwas weiter flussabwärts, wurde kein niedrigerer Stand je verzeichnet. Unterhalb von 40 Zentimetern bei Kaub ist nennenswerte Frachtschifffahrt praktisch nicht mehr möglich; Frachtschiffe fuhren zuletzt nur noch mit rund einem Fünftel ihrer eigentlichen Kapazität, was vier- bis fünfmal so viele Schiffe für dieselbe Ladung nötig machte – mit entsprechenden Folgekosten für Industrie und Handel entlang des Flusses. Mitte September fand zum fünften Mal die „Woche der Klimaanpassung&quot; statt – ein Name, der in diesem Jahr weniger nach Vorsorge klingt als nach Nachbereitung.</p>
    </div>
    <p class=&quot;schluss&quot;>Vier Geschichten, ein wiederkehrendes Muster: Fortschritt, Wachstum und politische Kompromisse kommen fast nie allein – sie bringen eine zweite Zahl mit, die erst später vorgelegt wird. Die KI-Branche verdient Rekordsummen und wird gleichzeitig genauer geprüft als je zuvor. Die deutsche Wirtschaft wächst stärker als gedacht, trägt aber dieselben alten Lasten weiter. Eine Koalition rettet ihre Reform, indem sie fast daran zerbricht. Und ein Sommer, der im Kalender schon vorbei ist, schreibt seine Rechnung erst jetzt, in Toten und in leeren Frachtschiffen. Morgen früh mehr davon.</p>
